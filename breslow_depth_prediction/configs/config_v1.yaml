# Breslow Depth Prediction Configuration

# Data Configuration
data:
  data_dir: "../data"             # relative to project root — dataset lives one level up
  images_dir: "ds_WSIs"
  coords_file: "measurements/breslow_depth_coords.csv"
  exclude_file: "measurements/wrong_dir_coords.txt"
  image_suffix: "_image.png"
  mask_suffix: "_labels.png"
  resolution_um_per_pixel: 4.0
  image_size: [512, 512]        # [height, width] - resize all images to this size

# Mask Class Mapping (RGB to class index)
classes:
  background: 0      # Black (0, 0, 0)
  tumour: 1          # Blue (0, 0, 255)
  epidermis: 2       # Green (0, 255, 0)
  dermis: 3          # Red (255, 0, 0)
  num_classes: 4

# Breslow Depth Thresholds (in micrometres)
breslow_thresholds:
  T1a_max: 800       # < 0.8mm
  T1b_max: 1000      # 0.8-1.0mm
  T2_max: 2000       # 1.0-2.0mm
  T3_max: 4000       # 2.0-4.0mm
  # T4: > 4.0mm

# Data Split
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratify: true     # Stratify by T-category

# Training Configuration
training:
  batch_size: 4
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 15

# Model Configuration
model:
  architecture: "UnetPlusPlus"  # or "Unet", "DeepLabV3Plus"
  encoder: "efficientnet-b4"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 4

# Augmentation
augmentation:
  train:
    horizontal_flip: true
    vertical_flip: true
    random_rotate_90: true
    brightness_contrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
    hue_saturation:
      hue_shift_limit: 10
      sat_shift_limit: 20
      val_shift_limit: 10
  val:
    # No augmentation for validation
    normalize_only: true

# Loss Function
loss:
  type: "combined"           # "dice", "ce", "combined"
  dice_weight: 0.5
  ce_weight: 0.5
  class_weights: [0.1, 1.0, 1.0, 0.5]  # [bg, tumour, epidermis, dermis]

# Evaluation
evaluation:
  metrics: ["dice", "iou", "precision", "recall"]
  breslow_mae_target: 500    # Target MAE in µm
  inter_observer_var: 860    # Clinical baseline in µm

# Paths
paths:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  log_dir: "logs"
